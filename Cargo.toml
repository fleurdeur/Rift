[package]
name = "riff"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Rift for Android — a native Rust music player for YouTube, SoundCloud and local audio"
authors = ["Rift contributors"]
build = "build.rs"

[lib]
name = "riff"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "riff-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["slint/backend-winit", "slint/renderer-winit-software"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "flac", "wav", "vorbis"] }
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
urlencoding = "2"
rand = "0.9"
once_cell = "1"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[package.metadata.android]
package = "io.github.rootscripts.riff"
apk_name = "Rift"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"
assets = "assets"
